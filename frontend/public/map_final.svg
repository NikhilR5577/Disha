<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1142" width="1024" height="1142">
  <defs>
    <!-- Filter to obscure the "District Hospital Sagar" text at the top of the images -->
    <filter id="blur-text" x="0" y="0" width="1" height="1">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Ground Floor Image -->
  <image href="/ground_floor.png" x="0" y="0" width="1024" height="571" />
  
  <!-- Obscure "District Hospital Sagar (India)" text on Ground Floor -->
  <rect x="250" y="20" width="550" height="90" fill="#ffffff" />
  <text x="512" y="70" font-family="sans-serif" font-size="42" font-weight="900" fill="#F97316" text-anchor="middle">Disha - Ground Floor</text>

  <!-- First Floor Image -->
  <image href="/first_floor.png" x="0" y="571" width="1024" height="571" />

  <!-- Obscure "District Hospital Sagar (India)" text on First Floor -->
  <rect x="250" y="591" width="550" height="90" fill="#ffffff" />
  <text x="512" y="641" font-family="sans-serif" font-size="42" font-weight="900" fill="#F97316" text-anchor="middle">Disha - First Floor</text>


  <!-- The routing path container -->
  <g id="route-path-container"></g>
</svg>
